name: Build QuarkCookie APK
run-name: Build APK ${{ github.sha }}
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7
        run: |
          sudo apt update
          sudo apt install -y unzip
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Generate Gradle Wrapper with Gradle 8.7
        run: ./gradle-8.7/bin/gradle wrapper --gradle-version=8.7

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quark-cookie-apk
          path: app/build/outputs/apk/release/app-release.apk
